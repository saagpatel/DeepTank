# Project-scoped Codex defaults for DeepTank.
# This file is loaded only when the repository is trusted.
# Runtime model, approval, sandbox, and web search settings inherit from
# ~/.codex/config.toml or an explicit --profile layer.

project_doc_max_bytes = 65536
project_doc_fallback_filenames = ["TEAM_GUIDE.md", ".agents.md"]

[features]
collaboration_modes = true
request_rule = true
multi_agent = false
shell_snapshot = false
search_tool = false

[agents]
max_threads = 6
max_depth = 1
